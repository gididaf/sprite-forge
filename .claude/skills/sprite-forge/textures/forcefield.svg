<!-- forcefield.svg — energy barrier / force field, ANIMATED (pulse) + DECAL.
     Demonstrates a non-scroll motion: the grid and nodes PULSE in brightness and
     size (opacity + radius), looping back to their start. No background rect, so
     it renders TRANSPARENT (a decal you lay over a wall/door, not an opaque tile).
       SPACE — a 16px tech grid; boundary lines straddle every edge (lines at
               x/y = -1, 15, 31, 47, 63), so opposite edges are identical. Nodes
               are inset. Spatial seam ~0 per frame.
       TIME  — opacity values 0.35;0.85;0.35 and node r 2;3.6;2 both return to
               their start, so the pulse loops cleanly (ratio ~1).
     Bake animated with the tileable + animated flags. Restyle the cyan for a red
     containment field, green toxic barrier, etc. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- tech grid: lines straddle the tile edges so the lattice tiles seamlessly.
       The whole group pulses brightness (opacity returns to its start = clean loop). -->
  <g fill="#33ffe0">
    <animate attributeName="opacity" values="0.35;0.85;0.35" dur="1.6s" repeatCount="indefinite"/>
    <!-- vertical lines centred on 0,16,32,48,64 (edge ones straddle) -->
    <rect x="-1" y="0" width="2" height="64"/><rect x="15" y="0" width="2" height="64"/>
    <rect x="31" y="0" width="2" height="64"/><rect x="47" y="0" width="2" height="64"/>
    <rect x="63" y="0" width="2" height="64"/>
    <!-- horizontal lines centred on 0,16,32,48,64 -->
    <rect x="0" y="-1" width="64" height="2"/><rect x="0" y="15" width="64" height="2"/>
    <rect x="0" y="31" width="64" height="2"/><rect x="0" y="47" width="64" height="2"/>
    <rect x="0" y="63" width="64" height="2"/>
  </g>

  <!-- glowing nodes at interior intersections — pulse in size (r returns to start) -->
  <g fill="#caffef">
    <circle cx="16" cy="16" r="2"><animate attributeName="r" values="2;3.6;2" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="48" cy="16" r="2"><animate attributeName="r" values="2;3.6;2" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="32" cy="32" r="2"><animate attributeName="r" values="2;3.6;2" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="16" cy="48" r="2"><animate attributeName="r" values="2;3.6;2" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="48" cy="48" r="2"><animate attributeName="r" values="2;3.6;2" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
