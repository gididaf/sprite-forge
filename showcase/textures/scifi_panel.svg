<!-- scifi_panel.svg — tech / hull panel with greebles + glow strip (opaque, tiling).
     Each tile is one panel: a dark seam frame STRADDLES all four edges, so the
     edges are uniform and opposite edges match (seam 0). Greebles, bolts, and a
     glow strip sit inset inside. Recolour the glow for force-fields/reactors. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#181c22"/>
  <rect x="2" y="2" width="60" height="60" fill="#2a313a"/>

  <!-- bevel: light top/left -->
  <g opacity="0.5">
    <rect x="2" y="2" width="60" height="2" fill="#3e4854"/>
    <rect x="2" y="2" width="2"  height="60" fill="#3e4854"/>
    <rect x="2" y="60" width="60" height="2" fill="#10141a"/>
    <rect x="60" y="2" width="2" height="60" fill="#10141a"/>
  </g>

  <!-- greeble blocks, inset -->
  <g fill="#222932">
    <rect x="8"  y="8"  width="20" height="10" rx="1"/>
    <rect x="36" y="8"  width="20" height="6"  rx="1"/>
    <rect x="8"  y="46" width="14" height="10" rx="1"/>
  </g>

  <!-- glow strip -->
  <rect x="36" y="46" width="20" height="4" rx="2" fill="#33ffd0" opacity="0.85"/>
  <rect x="36" y="47" width="20" height="2" rx="1" fill="#caffef"/>

  <!-- corner bolts, inset -->
  <g fill="#10141a">
    <circle cx="6" cy="6" r="1.6"/><circle cx="58" cy="6" r="1.6"/>
    <circle cx="6" cy="58" r="1.6"/><circle cx="58" cy="58" r="1.6"/>
  </g>
</svg>
