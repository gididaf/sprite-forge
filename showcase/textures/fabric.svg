<!-- fabric.svg — basket-weave cloth / banner (opaque, seamlessly tiling).
     A 4x4 grid of 16px cells (period 16, tile = 4 cells). Each cell holds a
     rounded "thread" pill, alternating horizontal/vertical in a checker (the
     over/under weave). Pills are inset inside their cells, so every cell border
     — including the tile edges — is the dark weft colour. Opposite edges match
     (seam 0). Restyle by changing the two thread colours. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#3a2a4a"/>
  <!-- horizontal threads on (even+even / odd+odd) cells, vertical on the rest -->
  <g fill="#7a5a9a">
    <rect x="2"  y="5"  width="12" height="6" rx="3"/>
    <rect x="34" y="5"  width="12" height="6" rx="3"/>
    <rect x="18" y="21" width="12" height="6" rx="3"/>
    <rect x="50" y="21" width="12" height="6" rx="3"/>
    <rect x="2"  y="37" width="12" height="6" rx="3"/>
    <rect x="34" y="37" width="12" height="6" rx="3"/>
    <rect x="18" y="53" width="12" height="6" rx="3"/>
    <rect x="50" y="53" width="12" height="6" rx="3"/>
  </g>
  <g fill="#9a7aba">
    <rect x="21" y="2"  width="6" height="12" rx="3"/>
    <rect x="53" y="2"  width="6" height="12" rx="3"/>
    <rect x="5"  y="18" width="6" height="12" rx="3"/>
    <rect x="37" y="18" width="6" height="12" rx="3"/>
    <rect x="21" y="34" width="6" height="12" rx="3"/>
    <rect x="53" y="34" width="6" height="12" rx="3"/>
    <rect x="5"  y="50" width="6" height="12" rx="3"/>
    <rect x="37" y="50" width="6" height="12" rx="3"/>
  </g>
</svg>
